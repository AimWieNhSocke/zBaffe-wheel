<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>zBaffe Glücksrad</title>

  <style>
    :root{
      --bg: rgba(8, 6, 18, .94);
      --text: #ffffff;
      --blue: #00c3ff;
      --violet: #6a5cff;
      --pink: #ff2bd6;

      --glowSoft: 0 0 18px rgba(0,195,255,.18), 0 0 28px rgba(106,92,255,.14);
      --glowStrong: 0 0 18px rgba(0,195,255,.35), 0 0 28px rgba(106,92,255,.28);

      --card: rgba(0,0,0,.20);
      --cardBorder: rgba(255,255,255,.12);

      --nameBox: rgba(110, 80, 255, .30);
      --nameBoxBorder: rgba(110, 80, 255, .55);
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: radial-gradient(1200px 700px at 50% 20%, rgba(106,92,255,.18), transparent 55%),
                  radial-gradient(900px 600px at 20% 70%, rgba(0,195,255,.14), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow-x:hidden;
    }

    #confetti{
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
    }

    .page{
      width: min(1280px, 96vw);
      margin: 18px auto 22px auto;
      display:grid;
      grid-template-columns: 340px 1fr 280px;
      grid-template-rows: auto 1fr auto auto;
      gap: 18px;
      min-height: calc(100vh - 40px);
      align-items:start;
    }

    .titleBlock{
      grid-column: 1 / 2;
      grid-row: 1 / 2;
      padding: 18px 18px;
      border-radius: 18px;
      background: rgba(120, 255, 220, .12);
      border: 1px solid rgba(120, 255, 220, .30);
      box-shadow: var(--glowSoft);
      font-weight: 1200;
      font-size: 24px;
      letter-spacing: .4px;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    .controlsTop{
      grid-column: 2 / 3;
      grid-row: 1 / 2;
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 14px;
      flex-wrap:wrap;
      padding-top: 10px;
    }

    .topRight{
      grid-column: 3 / 4;
      grid-row: 1 / 2;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap: 10px;
      padding-top: 10px;
    }

    .trophyBtn{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: #fff;
      cursor:pointer;
      box-shadow: var(--glowSoft);
      font-size: 18px;
      font-weight: 1200;
      display:grid;
      place-items:center;
    }
    .trophyBtn:hover{ background: rgba(0,0,0,.34); }

    select, .chipBtn{
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(0,0,0,.28);
      color: #fff;
      outline: none;
      font-weight: 1100;
      cursor: pointer;
      box-shadow: var(--glowSoft);
    }
    .chipBtn{
      border-color: rgba(0,195,255,.28);
      background: rgba(0,0,0,.22);
    }
    select:hover, .chipBtn:hover{ background: rgba(0,0,0,.34); }

    .leftCol{
      grid-column: 1 / 2;
      grid-row: 2 / 3;
      display:grid;
      gap: 12px;
      align-content:start;
      padding-top: 14px;
    }

    .miniCard{
      border-radius: 18px;
      border: 1px solid rgba(255,45,214,.38);
      background: rgba(255,45,214,.10);
      box-shadow: 0 0 18px rgba(255,45,214,.12), 0 0 28px rgba(0,195,255,.08);
      overflow:hidden;
    }
    .miniCardHeader{
      padding: 14px 14px;
      font-weight: 1300;
      letter-spacing: .3px;
      font-size: 18px;
      background: linear-gradient(135deg, rgba(255,45,214,.18), rgba(0,195,255,.12));
      border-bottom: 1px solid rgba(255,255,255,.10);
      text-align:center;
      user-select:none;
    }
    .miniCardBody{
      padding: 12px;
      display:grid;
      gap: 10px;
    }

    .miniBtn{
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      color:#fff;
      font-weight: 1100;
      cursor:pointer;
      user-select:none;
      text-align:center;
      box-shadow: 0 0 14px rgba(0,195,255,.06);
    }
    .miniBtn:hover{ background: rgba(255,255,255,.10); }
    .miniBtn.hidden{ display:none; }

    .wheelArea{
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      display:grid;
      place-items:center;
      position: relative;
      padding-top: 10px;
    }
    .wheelBox{
      width: min(720px, 78vw);
      aspect-ratio: 1/1;
      position: relative;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,.38));
    }
    canvas#wheel{ width:100%; height:100%; border-radius: 50%; }

    .pin{
      position:absolute;
      top:-8px; left:50%;
      transform:translateX(-50%);
      width:0; height:0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-bottom: 34px solid rgba(255,255,255,.95);
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }
    .centerCap{
      position:absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%,-50%);
      width: 18%;
      aspect-ratio: 1/1;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      box-shadow: inset 0 0 0 10px rgba(0,0,0,.12), 0 0 26px rgba(0,195,255,.18);
    }

    .rightCol{
      grid-column: 3 / 4;
      grid-row: 2 / 3;
      display:grid;
      gap: 12px;
      align-content:end;
      padding-bottom: 18px;
    }

    .historyCard{
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--cardBorder);
      padding: 10px 12px;
      box-shadow: var(--glowSoft);
    }
    .historyTitle{
      font-weight: 1200;
      opacity:.95;
      margin-bottom: 8px;
      text-align:center;
    }
    .historyList{
      display:grid;
      gap: 6px;
      font-weight: 900;
      font-size: 13px;
      opacity: .92;
      max-height: 240px;
      overflow:auto;
    }
    .histItem{
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      word-break: break-word;
    }

    .btnRow{
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      display:flex;
      justify-content:center;
      gap: 14px;
      flex-wrap:wrap;
      padding-top: 4px;
    }

    button.action{
      appearance:none;
      border:0;
      padding: 12px 16px;
      border-radius: 14px;
      color:#fff;
      font-weight: 1200;
      cursor:pointer;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      box-shadow: var(--glowStrong);
      transition: transform .06s ease, opacity .15s ease;
    }
    button.action:active{ transform: scale(.98); }
    button.action:disabled{ opacity:.55; cursor:not-allowed; box-shadow:none; }

    button.secondary{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: var(--glowSoft);
    }

    .namesBlock{
      grid-column: 2 / 3;
      grid-row: 4 / 5;
      border-radius: 18px;
      background: var(--nameBox);
      border: 1px solid var(--nameBoxBorder);
      padding: 16px;
      box-shadow: var(--glowStrong);
    }
    .namesHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
      flex-wrap:wrap;
      margin-bottom: 10px;
      font-weight: 1200;
    }
    .namesHint{ font-size: 12px; opacity:.9; font-weight: 1000; }

    textarea{
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color:#fff;
      padding: 14px 14px;
      outline:none;
      font-weight: 900;
      line-height: 1.2;
      box-sizing: border-box;
    }

    .nameChips{
      margin-top: 10px;
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
    }
    .chip{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      box-shadow: 0 0 14px rgba(0,195,255,.06);
      font-weight: 1000;
      max-width: 100%;
    }
    .chip .t{
      max-width: 220px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip .x{
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      font-weight: 1200;
      display:grid;
      place-items:center;
      line-height: 1;
    }
    .chip .x:hover{ background: rgba(255,255,255,.14); }

    .toast{
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      bottom: 18px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(6px);
      font-size: 12px;
      font-weight: 1100;
      transition: opacity .18s ease, transform .18s ease;
      box-shadow: var(--glowSoft);
      max-width: min(720px, 92vw);
      text-align:center;
    }
    .toast.show{ opacity: .96; transform: translateX(-50%) translateY(0); }

    .overlay{
      position: fixed;
      inset: 0;
      display:none;
      place-items:center;
      z-index: 10000;
      background: rgba(0,0,0,.58);
    }
    .box{
      width: min(820px, 92vw);
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(20, 10, 35, .94);
      border: 1px solid rgba(120,180,255,.35);
      box-shadow: var(--glowStrong);
      text-align:center;
      position: relative;
    }
    .box h2{ margin: 0 0 10px 0; font-size: 20px; font-weight: 1200; }
    .closeX{
      position:absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      font-weight: 1200;
      cursor: pointer;
      color:#fff;
    }
    .boxActions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 12px;
    }

    .rangeRow{ display:grid; gap:6px; text-align:left; width:min(520px, 92vw); margin: 0 auto; }
    input[type="range"]{ width:100%; }

    .winnerName{
      font-size: 28px;
      font-weight: 1300;
      letter-spacing: .2px;
      margin-top: 6px;
      word-break: break-word;
    }
    .winnerPulse{
      animation: pulseGlow 1.05s ease-in-out infinite;
      text-shadow: 0 0 14px rgba(0,195,255,.35), 0 0 22px rgba(106,92,255,.22);
    }
    @keyframes pulseGlow{
      0%{ transform: scale(1); filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }
      50%{ transform: scale(1.03); filter: drop-shadow(0 0 12px rgba(0,195,255,.20)); }
      100%{ transform: scale(1); filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }
    }
    .winnerSub{
      opacity:.88;
      font-weight: 950;
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }

    .trophyList{
      margin-top: 10px;
      display:grid;
      gap: 10px;
      text-align:left;
      max-height: min(60vh, 520px);
      overflow:auto;
      padding-right: 4px;
    }
    .trophyRow{
      display:flex;
      align-items:flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      opacity: .55;
      filter: grayscale(1);
    }
    .trophyRow.unlocked{
      opacity: 1;
      filter: none;
      border-color: rgba(0,195,255,.20);
      background: rgba(0,195,255,.06);
      box-shadow: 0 0 14px rgba(0,195,255,.08);
    }
    .trophyIcon{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      font-weight: 1200;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .trophyName{ font-weight: 1200; }
    .trophyDesc{ font-size: 12px; opacity:.85; font-weight: 850; margin-top: 2px; }

    @media (max-width: 980px){
      .page{ grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; }
      .titleBlock{ grid-column: 1; grid-row: 1; }
      .controlsTop{ grid-column: 1; grid-row: 2; }
      .topRight{ grid-column: 1; grid-row: 3; justify-content:center; }
      .leftCol{ grid-column: 1; grid-row: 4; }
      .wheelArea{ grid-column: 1; grid-row: 5; }
      .rightCol{ grid-column: 1; grid-row: 6; }
      .btnRow{ grid-column: 1; }
      .namesBlock{ grid-column: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>
  <div class="toast" id="toast">---</div>

  <div class="overlay" id="linksOverlay">
    <div class="box">
      <button class="closeX" id="linksX">×</button>
      <h2>Links</h2>
      <div class="boxActions">
        <button class="action" id="openTikTok">TikTok</button>
        <button class="action secondary" id="openInsta">Instagram</button>
        <button class="action secondary" id="openTwitch">Twitch</button>
      </div>
      <div class="boxActions">
        <button class="action secondary" id="linksClose">Schließen</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="box">
      <button class="closeX" id="settingsX">×</button>
      <h2>Einstellungen</h2>

      <div style="display:grid;gap:14px;margin-top:8px;">
        <div class="rangeRow">
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <div style="font-weight:1100;opacity:.92;">Rad drehen</div>
            <div id="spinVolLabel" style="font-weight:1200;opacity:.9;">8%</div>
          </div>
          <input id="spinVol" type="range" min="0" max="100" value="8">
        </div>

        <div class="rangeRow">
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <div style="font-weight:1100;opacity:.92;">Nudel entfernen</div>
            <div id="sadVolLabel" style="font-weight:1200;opacity:.9;">40%</div>
          </div>
          <input id="sadVol" type="range" min="0" max="100" value="40">
        </div>

        <div class="rangeRow">
          <div style="display:flex;justify-content:space-between;gap:10px;">
            <div style="font-weight:1100;opacity:.92;">Rad Dauer</div>
            <div id="spinDurLabel" style="font-weight:1200;opacity:.9;">3s</div>
          </div>
          <input id="spinDur" type="range" min="1" max="60" value="3">
        </div>

        <label style="display:flex;gap:10px;align-items:center;justify-content:center;font-weight:1100;opacity:.92;">
          <input id="muteAll" type="checkbox">
          Alles stumm
        </label>
      </div>

      <div class="boxActions">
        <button class="action secondary" id="settingsClose">Schließen</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="trophyOverlay">
    <div class="box">
      <button class="closeX" id="trophyX">×</button>
      <h2>Erfolge</h2>

      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;opacity:.9;font-weight:1100;">
        <div>Drehs: <span id="cntSpins">0</span></div>
        <div>Entfernt: <span id="cntRemoves">0</span></div>
      </div>

      <div class="trophyList" id="trophyList"></div>

      <div class="boxActions">
        <button class="action secondary" id="trophyClose">Schließen</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="winnerOverlay">
    <div class="box">
      <button class="closeX" id="winnerX">×</button>
      <h2>Gewinner</h2>
      <div class="winnerName" id="winnerName">—</div>
      <div class="winnerSub" id="winnerSub"></div>
      <div class="boxActions" style="margin-top:14px;">
        <button class="action secondary" id="winnerKeep">Nudel lassen</button>
        <button class="action" id="winnerRemove">Nudel entfernen</button>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="titleBlock">zBaffe Glücksrad</div>

    <div class="controlsTop">
      <select id="mode">
        <option value="keep">Nudel lassen</option>
        <option value="remove" selected>Nudel entfernen</option>
      </select>

      <button class="chipBtn" id="linksBtn">Links</button>
      <button class="chipBtn" id="settingsBtn">Einstellungen</button>
    </div>

    <div class="topRight">
      <button class="trophyBtn" id="trophyBtn" title="Erfolge">🏆</button>
    </div>

    <div class="leftCol">
      <div class="miniCard">
        <div class="miniCardHeader">Mini Games (später)</div>
        <div class="miniCardBody">
          <div class="miniBtn" id="miniDummy1">kommt gleich</div>
          <div class="miniBtn" id="miniDummy2">kommt gleich</div>
          <div class="miniBtn" id="miniDummy3">kommt gleich</div>
        </div>
      </div>
    </div>

    <div class="wheelArea">
      <div class="wheelBox">
        <div class="pin"></div>
        <canvas id="wheel" width="1000" height="1000"></canvas>
        <div class="centerCap"></div>
      </div>
    </div>

    <div class="rightCol">
      <div class="historyCard">
        <div class="historyTitle">Verlauf</div>
        <div class="historyList" id="historyList"></div>
      </div>
    </div>

    <div class="btnRow">
      <button class="action" id="spin">Nudel umrühren</button>
      <button class="action" id="removeWinner" disabled>Nudel entfernen</button>
      <button class="action secondary" id="shuffle">Mischen</button>
      <button class="action secondary" id="reset">Reset</button>
    </div>

    <div class="namesBlock">
      <div class="namesHead">
        <div>Teilnehmer</div>
        <div class="namesHint">eine Zeile = ein Name</div>
      </div>
      <textarea id="items">NicoRU/AimWieNhSOcke
Test1
Test2
test3</textarea>
      <div class="nameChips" id="nameChips"></div>
    </div>
  </div>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const TAU = Math.PI * 2;

      const toast = $("toast");
      const showToast = (text) => {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2300);
      };

      const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
      const rand01 = () => {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return a[0] / 4294967296;
      };
      const randInt = (min,maxInc)=> min + Math.floor(rand01()*(maxInc-min+1));

      const openOverlay = (el)=> el.style.display="grid";
      const closeOverlay = (el)=> el.style.display="none";

      const LINKS = {
        tiktok: "https://www.tiktok.com/@zbaffe",
        insta: "https://www.instagram.com/zbaffe/",
        twitch: "https://www.twitch.tv/zbaffe"
      };

      // Confetti
      const conf = $("confetti");
      const cctx = conf.getContext("2d");
      let confettiParts = [];
      let confettiEndAt = 0;

      const resizeConf = () => {
        conf.width = Math.floor(window.innerWidth * devicePixelRatio);
        conf.height = Math.floor(window.innerHeight * devicePixelRatio);
      };
      window.addEventListener("resize", resizeConf);
      resizeConf();

      const startConfetti = (ms=1400) => {
        confettiEndAt = performance.now() + ms;
        const count = 140;
        const w = conf.width, h = conf.height;
        const colors = ["#00c3ff","#6a5cff","#ff2bd6","#ffffff","#4d9fff"];
        for(let i=0;i<count;i++){
          confettiParts.push({
            x: rand01()*w,
            y: -rand01()*h*0.2,
            vx: (rand01()-0.5)*3*devicePixelRatio,
            vy: (2+rand01()*6)*devicePixelRatio,
            rot: rand01()*TAU,
            vr: (rand01()-0.5)*0.2,
            s: (4+rand01()*8)*devicePixelRatio,
            c: colors[i%colors.length],
            a: 1
          });
        }
        if(!startConfetti._raf) startConfetti._raf = requestAnimationFrame(confettiFrame);
      };

      function confettiFrame(t){
        const w = conf.width, h = conf.height;
        cctx.clearRect(0,0,w,h);
        for(const p of confettiParts){
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.vy += 0.04*devicePixelRatio;
          if(p.y > h + 50*devicePixelRatio) p.a = 0;
          cctx.save();
          cctx.globalAlpha = Math.max(0, p.a);
          cctx.translate(p.x, p.y);
          cctx.rotate(p.rot);
          cctx.fillStyle = p.c;
          cctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.55);
          cctx.restore();
        }
        confettiParts = confettiParts.filter(p => p.a > 0);
        if(t < confettiEndAt || confettiParts.length){
          startConfetti._raf = requestAnimationFrame(confettiFrame);
        }else{
          startConfetti._raf = null;
          cctx.clearRect(0,0,w,h);
        }
      }

      // Trophies basic
      const TROPHIES = [
        { id:"first_spin", icon:"🍜", name:"Warm-Up", desc:"Erster Spin" },
        { id:"first_remove", icon:"💔", name:"No Mercy", desc:"Erstes Entfernen" },
        { id:"plot_survivor", icon:"🎭", name:"Plot Twist Survivor", desc:"Fake-Winner erlebt" }
      ];
      let trophyState = {};
      try{ trophyState = JSON.parse(localStorage.getItem("wheelTrophies") || "{}") || {}; }catch(e){}
      let counters = { spins: 0, removes: 0 };
      try{ counters = JSON.parse(localStorage.getItem("wheelCounters") || "null") || counters; }catch(e){}
      const saveCounters = ()=>{ try{ localStorage.setItem("wheelCounters", JSON.stringify(counters)); }catch(e){} };
      const saveTrophies = ()=>{ try{ localStorage.setItem("wheelTrophies", JSON.stringify(trophyState)); }catch(e){} };
      const unlockTrophy = (id) => {
        if(trophyState[id]) return;
        trophyState[id] = true;
        saveTrophies();
        showToast("Erfolg freigeschaltet");
      };
      const renderTrophies = () => {
        $("cntSpins").textContent = String(counters.spins||0);
        $("cntRemoves").textContent = String(counters.removes||0);
        const list = $("trophyList");
        list.innerHTML = "";
        for(const t of TROPHIES){
          const row = document.createElement("div");
          row.className = "trophyRow" + (trophyState[t.id] ? " unlocked" : "");
          row.innerHTML = `<div class="trophyIcon">${t.icon}</div><div><div class="trophyName">${t.name}</div><div class="trophyDesc">${t.desc}</div></div>`;
          list.appendChild(row);
        }
      };

      // Sounds + settings
      const SOUND_FILES = { spin:"spin.mp3", sad:"sad.mp3", lk:"lk.mp3" };
      let spinSfx=null, sadSfx=null, lkSfx=null;

      let settings = { spinVol:0.08, sadVol:0.40, spinDur:3, muted:false };
      try{
        const saved = JSON.parse(localStorage.getItem("wheelSettings") || "null");
        if(saved && typeof saved === "object"){
          if(typeof saved.spinVol==="number") settings.spinVol=saved.spinVol;
          if(typeof saved.sadVol==="number") settings.sadVol=saved.sadVol;
          if(typeof saved.spinDur==="number") settings.spinDur=saved.spinDur;
          settings.muted=!!saved.muted;
        }
      }catch(e){}
      const saveSettings = ()=>{ try{ localStorage.setItem("wheelSettings", JSON.stringify(settings)); }catch(e){} };

      const initSounds = ()=>{
        if(!spinSfx) spinSfx = new Audio(SOUND_FILES.spin);
        if(!sadSfx) sadSfx = new Audio(SOUND_FILES.sad);
        if(!lkSfx) lkSfx = new Audio(SOUND_FILES.lk);
        spinSfx.preload="auto"; sadSfx.preload="auto"; lkSfx.preload="auto";
        applyVolumes();
      };
      const applyVolumes = ()=>{
        const spinV = settings.muted ? 0 : clamp(settings.spinVol,0,1);
        const sadV  = settings.muted ? 0 : clamp(settings.sadVol,0,1);
        if(spinSfx) spinSfx.volume = spinV;
        if(sadSfx) sadSfx.volume = sadV;
        if(lkSfx) lkSfx.volume = sadV;
      };
      const playSpinLoop = ()=>{
        try{ initSounds(); applyVolumes(); spinSfx.pause(); spinSfx.currentTime=0; spinSfx.loop=true; spinSfx.play(); }catch(e){}
      };
      const stopSpinLoop = ()=>{
        try{ if(!spinSfx) return; spinSfx.pause(); spinSfx.currentTime=0; }catch(e){}
      };
      const playSad = ()=>{
        try{ initSounds(); applyVolumes(); sadSfx.pause(); sadSfx.currentTime=0; sadSfx.play(); }catch(e){}
      };
      const playLK = ()=>{
        try{ initSounds(); applyVolumes(); lkSfx.pause(); lkSfx.currentTime=0; lkSfx.play(); }catch(e){}
      };
      document.addEventListener("pointerdown", ()=>{ try{ initSounds(); }catch(e){} }, { once:true });

      // Wheel
      const canvas = $("wheel");
      const ctx = canvas.getContext("2d");

      const btnSpin = $("spin");
      const btnRemoveWinner = $("removeWinner");
      const btnShuffle = $("shuffle");
      const btnReset = $("reset");

      const input = $("items");
      const mode = $("mode");
      const historyList = $("historyList");
      const nameChips = $("nameChips");

      let items = [];
      let angle = 0;
      let spinning = false;
      let lastWinner = null;

      const parseItems = (text)=> text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

      const pushHistory = (text)=>{
        const div=document.createElement("div");
        div.className="histItem";
        div.textContent=text;
        historyList.prepend(div);
        while(historyList.children.length>10) historyList.removeChild(historyList.lastChild);
      };

      const niceColor = (i)=>{
        const colors=["#00c3ff","#6a5cff","#ff2bd6","#4d9fff","#8a5cff"];
        return colors[i % colors.length];
      };

      const draw = ()=>{
        const w=canvas.width, h=canvas.height;
        const cx=w/2, cy=h/2;
        const r=Math.min(w,h)*0.48;
        ctx.clearRect(0,0,w,h);

        if(items.length===0){
          ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU);
          ctx.fillStyle="rgba(255,255,255,.08)"; ctx.fill();
          ctx.fillStyle="rgba(255,255,255,.65)";
          ctx.font="900 44px system-ui";
          ctx.textAlign="center";
          ctx.fillText("Keine Einträge", cx, cy);
          return;
        }

        const n=items.length;
        const slice=TAU/n;

        ctx.beginPath();
        ctx.arc(cx,cy,r*1.04,0,TAU);
        ctx.fillStyle="rgba(255,255,255,.10)";
        ctx.fill();

        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(angle);

        for(let i=0;i<n;i++){
          const start=i*slice;
          const end=start+slice;

          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.arc(0,0,r,start,end);
          ctx.closePath();
          ctx.fillStyle=niceColor(i);
          ctx.fill();

          ctx.strokeStyle="rgba(0,0,0,.18)";
          ctx.lineWidth=6;
          ctx.stroke();

          const label=items[i]||"—";
          let size=44;
          if(label.length>16) size=34;
          if(label.length>24) size=28;

          ctx.save();
          ctx.rotate(start+slice/2);
          ctx.textAlign="right";
          ctx.fillStyle="rgba(0,0,0,.78)";
          ctx.font=`900 ${size}px system-ui`;
          ctx.shadowColor="rgba(255,255,255,.45)";
          ctx.shadowBlur=5;
          ctx.fillText(label, r-24, 14);
          ctx.restore();
        }

        ctx.restore();

        const grad=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r*1.08);
        grad.addColorStop(0,"rgba(255,255,255,.08)");
        grad.addColorStop(1,"rgba(0,0,0,.36)");
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,TAU);
        ctx.fillStyle=grad;
        ctx.fill();
      };

      const currentWinner = ()=>{
        const n=items.length;
        const slice=TAU/n;
        const pointer=-Math.PI/2;
        const a=((pointer-angle)%TAU+TAU)%TAU;
        const idx=Math.floor(a/slice)%n;
        return { idx, label: items[idx] ?? "—" };
      };

      const updateRemoveButton = ()=>{
        const can=(mode.value==="remove") && items.length>1 && !!lastWinner;
        btnRemoveWinner.disabled=!can;
      };

      const renderNameChips = ()=>{
        const now=parseItems(input.value);
        nameChips.innerHTML="";
        for(const name of now){
          const chip=document.createElement("div");
          chip.className="chip";
          chip.innerHTML=`<div class="t">${name}</div><button class="x">×</button>`;
          chip.querySelector(".x").addEventListener("click", ()=>{
            const next=parseItems(input.value).filter(n=>n!==name);
            input.value=next.join("\n");
            items=next;
            lastWinner=null;
            btnRemoveWinner.disabled=true;
            renderNameChips();
            draw();
          });
          nameChips.appendChild(chip);
        }
      };

      const removeByName = (name)=>{
        const idx=items.findIndex(x=>x===name);
        if(idx===-1) return false;
        items.splice(idx,1);
        input.value=items.join("\n");
        renderNameChips();
        draw();
        return true;
      };

      // Winner popup + fake winner (selten + cooldown)
      const winnerOverlay = $("winnerOverlay");
      const winnerNameEl = $("winnerName");
      const winnerSubEl = $("winnerSub");

      const FAKE_WIN_CHANCE = 0.002;
      const FAKE_WIN_COOLDOWN_SPINS = 25;
      let spinsSinceFake = 999;
      let pendingRealWinner = null;
      let fakeTimer = null;

      const clearFakeTimer = ()=>{
        if(fakeTimer){ clearTimeout(fakeTimer); fakeTimer=null; }
        pendingRealWinner=null;
      };

      const setWinnerText = (name, sub)=>{
        winnerNameEl.textContent=name;
        winnerSubEl.textContent=sub||"";
      };

      const celebrate = ()=>{
        winnerNameEl.classList.add("winnerPulse");
        startConfetti(1400);
        setTimeout(()=>winnerNameEl.classList.remove("winnerPulse"), 1800);
      };

      const showWinnerPopup = (realName)=>{
        clearFakeTimer();
        spinsSinceFake++;

        const canFake = spinsSinceFake >= FAKE_WIN_COOLDOWN_SPINS;
        const doFake = canFake && items.length>=2 && (rand01()<FAKE_WIN_CHANCE);

        if(doFake){
          const other = items.filter(x=>x!==realName);
          const fake = other.length ? other[randInt(0, other.length-1)] : realName;

          spinsSinceFake=0;
          pendingRealWinner=realName;

          setWinnerText(fake,"…");
          openOverlay(winnerOverlay);
          playLK();
          unlockTrophy("plot_survivor");

          fakeTimer=setTimeout(()=>{
            setWinnerText(pendingRealWinner,"Plot Twist");
            pendingRealWinner=null;
            fakeTimer=null;
            celebrate();
          },700);

          return;
        }

        setWinnerText(realName,"");
        openOverlay(winnerOverlay);
        celebrate();
      };

      $("winnerX").addEventListener("click", ()=>{ clearFakeTimer(); closeOverlay(winnerOverlay); });
      winnerOverlay.addEventListener("click", (e)=>{ if(e.target===winnerOverlay){ clearFakeTimer(); closeOverlay(winnerOverlay); } });

      $("winnerKeep").addEventListener("click", ()=>{
        clearFakeTimer();
        closeOverlay(winnerOverlay);
        showToast("Nudel bleibt");
      });

      $("winnerRemove").addEventListener("click", ()=>{
        if(pendingRealWinner){ showToast("Warte…"); return; }
        const name=winnerNameEl.textContent||"";
        if(!name) return;

        playSad();
        const ok=removeByName(name);
        if(ok){
          counters.removes=(counters.removes||0)+1;
          saveCounters();
          unlockTrophy("first_remove");
          showToast("Nudel entfernt");
          lastWinner=null;
          btnRemoveWinner.disabled=true;
          closeOverlay(winnerOverlay);
        }
      });

      // Spin / Buttons
      const spin = ()=>{
        if(spinning) return;

        items=parseItems(input.value);
        renderNameChips();
        draw();

        if(items.length<2){
          showToast("Mindestens 2 Einträge zum Drehen");
          return;
        }

        counters.spins=(counters.spins||0)+1;
        saveCounters();
        unlockTrophy("first_spin");

        spinning=true;
        btnSpin.disabled=true;
        btnRemoveWinner.disabled=true;

        playSpinLoop();

        const duration = clamp((settings.spinDur||3)*1000, 1000, 60000);
        const extraSpins = 8;

        const n=items.length;
        const slice=TAU/n;

        const targetIndex=randInt(0,n-1);
        const inside=(rand01()*0.6+0.2)*slice;

        const pointer=-Math.PI/2;
        const targetAngle=pointer-(targetIndex*slice+inside);

        const startAngle=angle;
        const endAngle=targetAngle-extraSpins*TAU;

        const start=performance.now();
        const easeOutCubic=(t)=>1-Math.pow(1-t,3);

        const frame=(now)=>{
          const t=Math.min(1,(now-start)/duration);
          const e=easeOutCubic(t);
          angle=startAngle+(endAngle-startAngle)*e;
          draw();

          if(t<1){
            requestAnimationFrame(frame);
          }else{
            stopSpinLoop();
            spinning=false;
            btnSpin.disabled=false;

            angle=((angle%TAU)+TAU)%TAU;

            lastWinner=currentWinner();
            pushHistory(lastWinner.label);
            updateRemoveButton();
            showWinnerPopup(lastWinner.label);
          }
        };

        requestAnimationFrame(frame);
      };

      const removeLastWinner = ()=>{
        if(!lastWinner) return;
        if(mode.value!=="remove"){
          btnRemoveWinner.disabled=true;
          showToast("Modus: Nudel lassen");
          return;
        }
        playSad();
        const ok=removeByName(lastWinner.label);
        if(ok){
          counters.removes=(counters.removes||0)+1;
          saveCounters();
          unlockTrophy("first_remove");
          showToast("Nudel entfernt");
          lastWinner=null;
          btnRemoveWinner.disabled=true;
        }
      };

      const shuffle = ()=>{
        items=parseItems(input.value);
        for(let i=items.length-1;i>0;i--){
          const j=randInt(0,i);
          [items[i],items[j]]=[items[j],items[i]];
        }
        input.value=items.join("\n");
        lastWinner=null;
        btnRemoveWinner.disabled=true;
        showToast("Gemischt");
        renderNameChips();
        draw();
      };

      const reset = ()=>{
        angle=0;
        lastWinner=null;
        btnRemoveWinner.disabled=true;
        showToast("Reset");
        draw();
      };

      btnSpin.addEventListener("click", spin);
      btnRemoveWinner.addEventListener("click", removeLastWinner);
      btnShuffle.addEventListener("click", shuffle);
      btnReset.addEventListener("click", reset);

      input.addEventListener("input", ()=>{
        items=parseItems(input.value);
        lastWinner=null;
        btnRemoveWinner.disabled=true;
        renderNameChips();
        draw();
      });

      mode.addEventListener("change", updateRemoveButton);

      // Overlays wiring
      const linksOverlay = $("linksOverlay");
      const settingsOverlay = $("settingsOverlay");
      const trophyOverlay = $("trophyOverlay");

      $("linksBtn").addEventListener("click", ()=>openOverlay(linksOverlay));
      $("settingsBtn").addEventListener("click", ()=>{ syncSettingsUi(); openOverlay(settingsOverlay); });
      $("trophyBtn").addEventListener("click", ()=>{ renderTrophies(); openOverlay(trophyOverlay); });

      $("linksX").addEventListener("click", ()=>closeOverlay(linksOverlay));
      $("linksClose").addEventListener("click", ()=>closeOverlay(linksOverlay));
      linksOverlay.addEventListener("click", (e)=>{ if(e.target===linksOverlay) closeOverlay(linksOverlay); });

      $("settingsX").addEventListener("click", ()=>closeOverlay(settingsOverlay));
      $("settingsClose").addEventListener("click", ()=>closeOverlay(settingsOverlay));
      settingsOverlay.addEventListener("click", (e)=>{ if(e.target===settingsOverlay) closeOverlay(settingsOverlay); });

      $("trophyX").addEventListener("click", ()=>closeOverlay(trophyOverlay));
      $("trophyClose").addEventListener("click", ()=>closeOverlay(trophyOverlay));
      trophyOverlay.addEventListener("click", (e)=>{ if(e.target===trophyOverlay) closeOverlay(trophyOverlay); });

      $("openTikTok").addEventListener("click", ()=>window.open(LINKS.tiktok,"_blank"));
      $("openInsta").addEventListener("click", ()=>window.open(LINKS.insta,"_blank"));
      $("openTwitch").addEventListener("click", ()=>window.open(LINKS.twitch,"_blank"));

      // Settings UI
      const spinVol=$("spinVol"), sadVol=$("sadVol"), spinDur=$("spinDur"), muteAll=$("muteAll");
      const spinVolLabel=$("spinVolLabel"), sadVolLabel=$("sadVolLabel"), spinDurLabel=$("spinDurLabel");

      function syncSettingsUi(){
        spinVol.value=String(Math.round(clamp(settings.spinVol,0,1)*100));
        sadVol.value=String(Math.round(clamp(settings.sadVol,0,1)*100));
        spinDur.value=String(clamp(Math.round(settings.spinDur||3),1,60));
        muteAll.checked=!!settings.muted;

        spinVolLabel.textContent=spinVol.value+"%";
        sadVolLabel.textContent=sadVol.value+"%";
        spinDurLabel.textContent=spinDur.value+"s";
      }

      spinVol.addEventListener("input", ()=>{
        settings.spinVol=Number(spinVol.value)/100;
        settings.muted=false;
        muteAll.checked=false;
        spinVolLabel.textContent=spinVol.value+"%";
        applyVolumes(); saveSettings();
      });
      sadVol.addEventListener("input", ()=>{
        settings.sadVol=Number(sadVol.value)/100;
        settings.muted=false;
        muteAll.checked=false;
        sadVolLabel.textContent=sadVol.value+"%";
        applyVolumes(); saveSettings();
      });
      spinDur.addEventListener("input", ()=>{
        settings.spinDur=clamp(Number(spinDur.value),1,60);
        spinDurLabel.textContent=spinDur.value+"s";
        saveSettings();
      });
      muteAll.addEventListener("change", ()=>{
        settings.muted=muteAll.checked;
        applyVolumes(); saveSettings();
      });

      document.addEventListener("keydown", (e)=>{
        if(e.key!=="Escape") return;
        closeOverlay(linksOverlay);
        closeOverlay(settingsOverlay);
        closeOverlay(trophyOverlay);
        clearFakeTimer();
        closeOverlay(winnerOverlay);
      });

      // Init
      items=parseItems(input.value);
      renderNameChips();
      syncSettingsUi();
      saveSettings();
      draw();
    })();
  </script>
</body>
</html>
